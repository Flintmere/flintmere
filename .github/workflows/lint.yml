# Lint replaces the in-build ESLint pass that next.config.ts disabled
# for build-time savings (Tier-1 build optimisation 2026-04-29).
# Runs on every PR + push to main; blocks merge if lint fails.

name: lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter "@flintmere/*" build

      # Whole workspace, not just scanner. When ESLint 9 dropped `.eslintrc`
      # only `apps/scanner` was migrated, and this step's previous
      # `pnpm -F scanner lint` scope meant the other three packages could
      # sit broken — `eslint` against no config, exiting non-zero — without
      # CI ever saying so. `-r` skips packages that declare no lint script
      # (packages/ui), so this covers exactly the four that do.
      - name: Lint workspace
        run: pnpm -r lint

      # Blog content gate (blog-system, editorial standard §F). Assistive —
      # blocks merge on mechanical failures (word floor, banned phrase /
      # AI-tell, bad frontmatter, missing sources/FAQ, broken JSON-LD). The
      # human reviewer still reads + merges every post.
      - name: Validate blog content
        run: pnpm -F scanner blog:validate
