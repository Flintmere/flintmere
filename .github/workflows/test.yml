# Typecheck + unit tests.
#
# Added 2026-11-07. Until now CI ran two jobs — `lint` and the Playwright
# `mobile-reflow` suite — and neither executed `tsc` or vitest. 1,240 unit
# tests across five packages ran only on whoever's laptop remembered to
# run them, so a test could sit red on main indefinitely and every PR
# would still go green. Found while adding the band-picker gate tests
# (PR #131): two of the three gates written that day were vitest tests
# CI would never have run, which makes them notes to self rather than
# gates.
#
# Two jobs rather than extra steps on `lint`, so a red check names which
# thing broke. `cache: pnpm` is already warm from the lint workflow, so
# the second install is cheap.

name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter "@flintmere/*" build

      # BOTH apps generate a Prisma client, and both are gitignored, so a
      # fresh checkout has neither. scanner imports `@/generated/prisma`;
      # shopify-app's `app/db.server.ts` imports `./generated/prisma`
      # (schema.prisma sets a per-app `output` so the two clients can
      # coexist in pnpm's hoisted node_modules). Without this step tsc
      # and vitest fail on the missing module rather than on real errors.
      #
      # This was `--filter scanner` on the first push and reddened `test`:
      # shopify-app's brand-from-vendor.test.ts pulls in db.server.ts, so
      # that suite failed to load (22 of 28 tests ran). It passed locally
      # only because both generated directories were already on disk —
      # precisely the class of defect CI exists to catch.
      - name: Generate Prisma clients
        run: pnpm -r prisma:generate

      # shopify-app is EXCLUDED, and this is a known debt, not an
      # oversight. It fails with TS2786 "'Link' cannot be used as a JSX
      # component" because two @types/react versions resolve in the same
      # tree — Remix pulls 18.3.28 while the workspace root is on
      # 19.2.14, and `bigint` in React 19's ReactNode makes the two
      # structurally incompatible. That is a dependency-resolution fix
      # (a pnpm override, or aligning Remix's React), not a type error
      # in anybody's code, and it predates this workflow. Running it
      # here would ship a job that is red on arrival, which teaches
      # people to ignore the check. Drop the filter once the override
      # lands; its own tests DO run in the `test` job below.
      - name: Typecheck
        run: pnpm -r --filter '!shopify-app' typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter "@flintmere/*" build

      # Both clients — see the longer note in the typecheck job above.
      - name: Generate Prisma clients
        run: pnpm -r prisma:generate

      # All five packages, shopify-app included — its 28 tests pass; only
      # its typecheck is blocked. 1,240 tests at the time of writing.
      - name: Unit tests
        run: pnpm -r test
